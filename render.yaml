# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: dashboard-operativo-integral
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
